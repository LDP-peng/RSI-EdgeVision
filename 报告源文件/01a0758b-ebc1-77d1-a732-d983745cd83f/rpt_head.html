<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>技术报告 · 基于 RDK-X5 的遥感图像边缘智能识别终端</title>
<style>
@page { size: A4; margin: 0; }
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1a5fb4; --blue2:#2d82ff; --cyan:#00a892; --ink:#15202e;
  --sub:#55657a; --line:#dbe3ec; --soft:#f4f8fc;
}
body{font-family:"宋体",SimSun,"Microsoft YaHei",serif;background:#e6ebf2;color:var(--ink);
  -webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:12pt;line-height:1.5}
.page{width:210mm;min-height:297mm;background:#fff;margin:0 auto 8mm;
  padding:25mm 30mm 22mm;position:relative;overflow:hidden}
@media print{body{background:#fff}.page{margin:0;page-break-after:always}.page:last-child{page-break-after:auto}}

/* 页眉页脚 */
.rhead{position:absolute;top:12mm;left:30mm;right:30mm;font-size:9pt;color:#93a2b4;
  border-bottom:1px solid var(--line);padding-bottom:4px;display:flex;justify-content:space-between}
.rfoot{position:absolute;bottom:10mm;left:30mm;right:30mm;text-align:center;font-size:9pt;color:#93a2b4}

/* 标题层级（按模板字号） */
.ctitle{font-size:22pt;font-weight:700;text-align:center;letter-spacing:2px}      /* 目录标题 二号 */
h1{font-size:16pt;font-weight:700;margin:2px 0 6px;letter-spacing:.5px}            /* 一级标题 三号 */
h1.bar{padding-left:12px;border-left:5px solid var(--blue)}
h2{font-size:14pt;font-weight:700;margin:14px 0 5px;color:#123c72}                 /* 二级标题 四号 */
h3{font-size:12pt;font-weight:700;margin:10px 0 4px}                               /* 三级标题 小四 */
p{margin:5px 0;text-align:justify;text-indent:2em}
p.noind{text-indent:0}
ul,ol{margin:5px 0 5px 0;padding-left:2em}li{margin:3px 0;text-align:justify}
code{background:#eef3f9;padding:1px 5px;border-radius:3px;font-family:Consolas,monospace;font-size:10pt;color:#0f4c81;font-style:normal}

/* 组件 */
.tip{border-left:4px solid var(--cyan);background:#f0faf8;padding:8px 12px;margin:9px 0;font-size:11pt;border-radius:0 6px 6px 0;text-indent:0}
.tip b{color:var(--blue)}
.cards{display:flex;gap:8px;margin:9px 0}
.card{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 6px;text-align:center;background:linear-gradient(180deg,#f8fbfe,#fff)}
.card .n{font-size:14pt;font-weight:700;color:var(--blue);font-family:"Microsoft YaHei",sans-serif}
.card .t{font-size:8.5pt;color:var(--sub);margin-top:3px}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:10.5pt}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top;line-height:1.45}
th{background:var(--soft);font-weight:700;color:var(--blue);white-space:nowrap}
td.k{background:#fbfdff;color:var(--sub);white-space:nowrap;width:96px;font-weight:700}
figure{margin:9px 0}
figure img{width:100%;display:block;border:1px solid var(--line);border-radius:6px}
figcaption{font-size:9.5pt;color:var(--sub);margin-top:5px;text-align:center;text-indent:0}
.panel{background:#0d1626;border-radius:8px;padding:8px}
.panel svg{display:block;width:100%;height:auto}
.flow{display:flex;align-items:stretch;gap:0;margin:9px 0}
.flow .st{flex:1;border:1px solid var(--line);border-radius:7px;padding:7px 6px;text-align:center;background:#fff}
.flow .st .i{font-size:9pt;color:var(--cyan);font-weight:700}
.flow .st .h{font-size:10.5pt;font-weight:700;margin-top:2px}
.flow .st .d{font-size:9pt;color:var(--sub);margin-top:2px;line-height:1.4;text-indent:0}
.flow .ar{width:14px;display:flex;align-items:center;justify-content:center;color:#b9c6d4;font-size:12pt;flex:none}
.lblrow{display:flex;gap:8px;margin:8px 0 -4px}
.lblrow span{flex:1;text-align:center;font-size:9.5pt;font-weight:700;color:var(--blue);background:#eef5fc;border:1px solid var(--line);border-radius:5px;padding:4px 2px}

/* 目录 */
.toc{list-style:none;padding:0;margin:18px 0 0}
.toc li{display:flex;align-items:baseline;gap:6px;margin:7px 0;font-size:12pt;text-indent:0}
.toc li.d1{font-weight:700;margin-top:12px}
.toc li.d2{padding-left:1.8em}
.toc li.d3{padding-left:3.6em;color:var(--sub);font-size:11pt}
.toc .dots{flex:1;border-bottom:1px dotted #c3cedb;margin:0 6px;transform:translateY(-3px)}

/* 封面 */
.cover{background:#0a1120;color:#e8eef8;padding:0;display:flex;flex-direction:column;justify-content:center;height:297mm}
.cover .bar{position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#2d82ff,#00d7c0 55%,#7a5cff)}
.cover .in{padding:0 26mm}
.cover .yr{font-size:13pt;letter-spacing:6px;color:#63a4ff;font-weight:700;text-align:center}
.cover .ev{font-size:21pt;letter-spacing:5px;font-weight:800;text-align:center;margin-top:12px;color:#eaf2ff}
.cover .tr{font-size:15pt;letter-spacing:9px;color:#8fb6e8;text-align:center;margin-top:16px}
.cover .line{width:100%;height:2px;background:linear-gradient(90deg,transparent,#2d82ff,transparent);margin:34px 0}
.cover .doc{font-size:30pt;font-weight:800;letter-spacing:10px;text-align:center;
  background:linear-gradient(92deg,#fff 8%,#8fc4ff 55%,#4ee0cf 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.cover .meta{margin-top:44px;font-size:12.5pt;line-height:2.5;color:#cfe0f5}
.cover .meta .r{display:flex;border-bottom:1px solid rgba(90,160,255,.18);padding:3px 0}
.cover .meta .l{width:110px;color:#8ea2bb;letter-spacing:4px;flex:none}
.cover .meta .v{color:#eaf2ff;font-weight:700}
.cover .date{margin-top:52px;text-align:center;font-size:12.5pt;color:#a9bdd6;letter-spacing:3px}
.cover .foot{position:absolute;left:26mm;right:26mm;bottom:20mm;text-align:center;font-size:9.5pt;color:#6b7f99;letter-spacing:2px}
</style></head><body>
