<svg viewBox="0 0 980 330" xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a90d9"/>
    </marker>
    <linearGradient id="gEnc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16304f"/><stop offset="1" stop-color="#0f2038"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3f6b"/><stop offset="1" stop-color="#122b49"/>
    </linearGradient>
  </defs>

  <!-- 输入 -->
  <rect x="6" y="86" width="86" height="50" rx="7" fill="url(#gBlue)" stroke="#2d82ff" stroke-width="1.2"/>
  <text x="49" y="107" fill="#dbe7f7" font-size="13" text-anchor="middle" font-weight="600">T1 前时相</text>
  <text x="49" y="124" fill="#8ea2bb" font-size="10" text-anchor="middle">3×256×256</text>

  <rect x="6" y="196" width="86" height="50" rx="7" fill="url(#gBlue)" stroke="#2d82ff" stroke-width="1.2"/>
  <text x="49" y="217" fill="#dbe7f7" font-size="13" text-anchor="middle" font-weight="600">T2 后时相</text>
  <text x="49" y="234" fill="#8ea2bb" font-size="10" text-anchor="middle">3×256×256</text>

  <line x1="92" y1="111" x2="118" y2="150" stroke="#4a90d9" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="92" y1="221" x2="118" y2="182" stroke="#4a90d9" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- 共享编码器 -->
  <rect x="120" y="56" width="150" height="220" rx="9" fill="url(#gEnc)" stroke="#2d82ff" stroke-width="1.3"/>
  <text x="195" y="86" fill="#5fd8ff" font-size="13" text-anchor="middle" font-weight="700">共享编码器</text>
  <text x="195" y="106" fill="#dbe7f7" font-size="12" text-anchor="middle">MobileNetV2</text>
  <line x1="140" y1="120" x2="250" y2="120" stroke="#2d82ff" stroke-width=".7" opacity=".5"/>
  <text x="195" y="144" fill="#8ea2bb" font-size="10.5" text-anchor="middle">倒残差 + 深度可分离卷积</text>
  <text x="195" y="170" fill="#8ea2bb" font-size="10.5" text-anchor="middle">权重共享</text>
  <text x="195" y="200" fill="#5fd8ff" font-size="11" text-anchor="middle">↓ 输出 4 个尺度</text>
  <text x="195" y="222" fill="#dbe7f7" font-size="11.5" text-anchor="middle" font-weight="600">C2 · C3 · C4 · C5</text>
  <text x="195" y="250" fill="#8ea2bb" font-size="9.5" text-anchor="middle">双时相共用同一语义空间</text>

  <line x1="270" y1="166" x2="298" y2="166" stroke="#4a90d9" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- RTRF -->
  <rect x="300" y="56" width="150" height="220" rx="9" fill="url(#gBlue)" stroke="#00d7c0" stroke-width="1.3"/>
  <text x="375" y="84" fill="#4ee0cf" font-size="13" text-anchor="middle" font-weight="700">创新 ① RTRF</text>
  <text x="375" y="104" fill="#dbe7f7" font-size="11" text-anchor="middle">互易时相响应融合</text>
  <line x1="320" y1="118" x2="430" y2="118" stroke="#00d7c0" stroke-width=".7" opacity=".5"/>
  <text x="375" y="142" fill="#dbe7f7" font-size="10.5" text-anchor="middle">差异响应 D</text>
  <text x="375" y="162" fill="#dbe7f7" font-size="10.5" text-anchor="middle">能量响应 E</text>
  <text x="375" y="182" fill="#dbe7f7" font-size="10.5" text-anchor="middle">一致性响应 G</text>
  <text x="375" y="210" fill="#8ea2bb" font-size="9.5" text-anchor="middle">通道路由 + 空间路由</text>
  <text x="375" y="236" fill="#4ee0cf" font-size="10" text-anchor="middle">抑制阴影 / 光谱伪变化</text>

  <line x1="450" y1="166" x2="478" y2="166" stroke="#4a90d9" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- MSRB -->
  <rect x="480" y="56" width="150" height="220" rx="9" fill="url(#gBlue)" stroke="#00d7c0" stroke-width="1.3"/>
  <text x="555" y="84" fill="#4ee0cf" font-size="13" text-anchor="middle" font-weight="700">创新 ② MSRB</text>
  <text x="555" y="104" fill="#dbe7f7" font-size="11" text-anchor="middle">多尺度侧监督细化桥</text>
  <line x1="500" y1="118" x2="610" y2="118" stroke="#00d7c0" stroke-width=".7" opacity=".5"/>
  <text x="555" y="144" fill="#dbe7f7" font-size="10.5" text-anchor="middle">SCA 尺度上下文聚合</text>
  <text x="555" y="168" fill="#dbe7f7" font-size="10.5" text-anchor="middle">CDF 跨尺度细节融合</text>
  <text x="555" y="200" fill="#8ea2bb" font-size="9.5" text-anchor="middle">区域语义与边界细节</text>
  <text x="555" y="236" fill="#4ee0cf" font-size="10" text-anchor="middle">兼顾尺度跨度大</text>

  <line x1="630" y1="166" x2="658" y2="166" stroke="#4a90d9" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- SAM -->
  <rect x="660" y="56" width="150" height="220" rx="9" fill="url(#gBlue)" stroke="#00d7c0" stroke-width="1.3"/>
  <text x="735" y="84" fill="#4ee0cf" font-size="13" text-anchor="middle" font-weight="700">创新 ③ SAM</text>
  <text x="735" y="104" fill="#dbe7f7" font-size="11" text-anchor="middle">层级监督注意力解码</text>
  <line x1="680" y1="118" x2="790" y2="118" stroke="#00d7c0" stroke-width=".7" opacity=".5"/>
  <text x="735" y="144" fill="#dbe7f7" font-size="10.5" text-anchor="middle">多尺度侧输出预测图</text>
  <text x="735" y="168" fill="#dbe7f7" font-size="10.5" text-anchor="middle">前景/背景概率反作用于特征</text>
  <text x="735" y="200" fill="#8ea2bb" font-size="9.5" text-anchor="middle">BCE-Dice 多输出损失</text>
  <text x="735" y="236" fill="#4ee0cf" font-size="10" text-anchor="middle">逐步聚焦真实变化区</text>

  <line x1="810" y1="166" x2="838" y2="166" stroke="#4a90d9" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- 输出 -->
  <rect x="840" y="126" width="132" height="80" rx="9" fill="#0b2a24" stroke="#00d7c0" stroke-width="1.4"/>
  <text x="906" y="153" fill="#4ee0cf" font-size="12" text-anchor="middle" font-weight="700">change_map</text>
  <text x="906" y="173" fill="#dbe7f7" font-size="10.5" text-anchor="middle">1×1×256×256</text>
  <text x="906" y="192" fill="#8ea2bb" font-size="9.5" text-anchor="middle">sigmoid 概率图</text>
</svg>