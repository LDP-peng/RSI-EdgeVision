# 真实校准数据版（覆盖原 config.yaml，用于重新量化）
# 前提：先运行 make_cal_data.py 生成 /mnt/hgfs/LEVIR-CD/quant/cal_data/x1, x2
model_parameters:
  onnx_model: /data/best_model.onnx
  march: bayes-e
  output_model_file_prefix: repbnet_cd
  working_dir: /quant/model_output

input_parameters:
  input_name: "x1; x2"
  input_type_train: "featuremap; featuremap"
  input_layout_train: "NCHW; NCHW"
  input_shape: "1x3x256x256; 1x3x256x256"
  input_type_rt: "featuremap; featuremap"
  input_layout_rt: "NCHW; NCHW"
  norm_type: "no_preprocess; no_preprocess"

calibration_parameters:
  cal_data_dir: "/quant/cal_data/x1; /quant/cal_data/x2"
  cal_data_type: "float32; float32"
  calibration_type: default
  preprocess_on: False

compiler_parameters:
  compile_mode: latency
  optimize_level: O2
  core_num: 1
  jobs: 8
  debug: True

